  project_number: '254311132993'
  owner_group: lab@rafalwalas.com
  change_ref: 'manual:trzeci czlonek perimetru — nosnik jedynych regul EGRESS. Egress
    ma zostac w dry-run, a etap reguly egress jest w tym rendererze etapem CZLONKA
    (egress_rules_enforced filtruje po m.stage), wiec nie moze wisiec na t-alpha,
    ktory jest celem promocji do enforced; #1939: access level corp_network -> eu_only,
    zeby prymityw `regions` byl realnie REFEROWANY przez regule, a nie tylko istnial
    w polityce. Swiadomy kompromis: sam eu_only jest SLABSZY niz corp_network (kazdy
    adres z DE/FR/NL go spelnia). Dopuszczalne, bo t-beta jest pustym projektem testowym,
    a konfiguracja egzekwowana jest pusta. W realnym wdrozeniu regions nalezy do KOMPOZYCJI,
    nie stoi samo w regule'
  approved_by: mail@rafalwalas.com
