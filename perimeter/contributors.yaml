# Mapowanie: repozytorium zespołu → projekty, o które WOLNO mu wnioskować.
#
# DLACZEGO ten plik mieszka TUTAJ, a nie w repozytorium zespołu: gdyby zespół trzymał listę swoich
# dozwolonych projektów u siebie, mógłby ją sobie rozszerzyć tym samym commitem, którym dodaje projekt.
# Mapowanie jest jedyną rzeczą, której kanał „repo zespołu" nie może o sobie orzec — dlatego zmiana tego
# pliku wymaga approvalu sieci i security (CODEOWNERS), tak samo jak zmiana profilu.
#
# Dotyczy WYŁĄCZNIE kanału `change_ref: pr:ORG/repo#123`. Wniosek z ServiceNow (`snow:`) jest weryfikowany
# oddzwonieniem do systemu rekordu, a wpis ręczny (`manual:`) — approvalem CODEOWNERS.

schema_version: 1

contributors:
  # WPIS REALNY — repozytorium dywizji tego labu. Pozostałe (fikcyjne `ORG/example-*`) świadomie usunięte:
  # to jest rejestr WDROŻENIOWY, a nie szablon. Przykłady z komentarzem wyjaśniającym mechanizm żyją
  # w starterze (`template/perimeter/contributors.yaml.example`); tutaj fikcyjna dywizja obok prawdziwej
  # to zaproszenie do pomyłki „a ta druga to chyba też nasza".
  - repository: CptDolphin/gcp-vpc-sc-division-example
    division: lab-div
    # Lista JAWNA — brak wildcardów. Dołożenie projektu = PR do tego pliku z approvalem, czyli ta sama
    # bramka, która chroni profile. To jedyne miejsce, w którym zapisano, o co to repo może wnioskować:
    # po tamtej stronie tej informacji nie ma i nie może być, bo rozszerzyłaby się sama.
    allowed_projects:
      - rwlab-vpcsc-t-div
    # Kontakt do eskalacji, gdy zgłoszenie z tego repo wygląda podejrzanie.
    owner_group: lab@rafalwalas.com
