# Access levels — warunki KONTEKSTU, które musi spełnić wywołujący spoza perimetru.
#
# DLACZEGO w ogóle: sama tożsamość nie wystarcza. Skradziony token SA działa z dowolnej sieci; access level
# dokłada wymaganie „i to z naszej sieci / z zarządzanego urządzenia". Reguły ingress w profilach ZAWSZE
# odwołują się do access levelu — reguła bez niego autoryzuje kontekst, którego nikt nie sprawdził.

# NAZWY: `name` to short_name obiektu w Access Context Managerze — API wymaga, by zaczynał się LITERĄ i
# zawierał wyłącznie znaki alfanumeryczne oraz `_`. Myślnik jest odrzucany (`corp-network` nie przejdzie), a
# błąd wychodzi dopiero na apply. Ta sama zasada dotyczy nazwy perimetru w policy.yaml. Pilnują tego dwie
# warstwy: `schemas/access-level.schema.json` w CI i test w selfteście.
# Pole `title` jest wolnym tekstem — tam myślniki i spacje są w porządku.

# ================================================================================================
# UZBROJENIE (`armed`) — pole, które odróżnia poziom DZIAŁAJĄCY od poziomu, który tylko tak wygląda
# ================================================================================================
# Poziom oparty na zakresach IP ma dokładnie jeden tryb awarii, którego NIE WIDAĆ: zakres przestaje
# pasować (zmienił się koncentrator VPN, doszło biuro, dostawca przenumerował pulę NAT) — a obiekt
# w Access Context Managerze wygląda identycznie jak przedtem. Pusty zbiór dopasowań jest nieodróżnialny
# od „nikt nie próbował". Dowiadujesz się w dniu, w którym reguła zaczyna egzekwować: ruch dywizji ginie.
#
# Ten sam kształt bierze się z placeholderów, których nikt nie podmienił. Zakresy dokumentacyjne
# (RFC 5737: 192.0.2.0/24, 198.51.100.0/24, 203.0.113.0/24; RFC 3849: 2001:db8::/32) nie należą do
# ŻADNEGO hosta na świecie, więc poziom na nich oparty nie autoryzuje NIKOGO — mimo że w konsoli
# i w `describe` wygląda na kompletny.
#
#   armed: false  = „ten poziom dziś nie wpuszcza nikogo i wiemy o tym"  → wymaga `unarmed_reason`
#
# JAK Z TEGO WYJŚĆ — czyli jak przejść z `armed: false` na poziom, który kogoś realnie wpuszcza, i czym
# to udowodnić (para kanarków; z logu wpuszczenia NIE WIDAĆ): docs/8-zmiany-reczne.md §8.3.
#   armed: true   = „ktoś realnie może stąd przyjść"                     → przy `ip_subnetworks` wymaga
#                   `source_of_truth` + `reviewed` (skąd wartość i kiedy potwierdzona)
#   (brak pola)   = `true`
#
# Egzekwują to `precondition` w terraform/perimeter.tf (renderer — warstwa, której nie da się pominąć).
# Poziom `armed: false` referowany przez konfigurację EGZEKWOWANĄ wywraca plan, chyba że niesie
# `unarmed_accepted_until` z datą w przyszłości — świadomy, WYGASAJĄCY zapis „ta reguła nie wpuszcza
# dziś nikogo i to jest OK". Pełne uzasadnienie: DEC-19 w docs/0-decyzje.md.
#
# CZEGO TO NIE ROBI: nie sprawdza, czy zakres jest PRAWDZIWY — tego z konfiguracji nie da się orzec.
# Odpowiedzią na „skąd wiesz, że wartość jest aktualna" jest para: (1) `reviewed` + `review_interval_days`,
# czyli zegar, który po N dniach czerwieni plan, oraz (2) KANAREK — para reguł `canary-*` w policy.yaml,
# która sama generuje ruch przez access level i sprawdza, że poziom spełniony WPUSZCZA, a niespełniony
# ODMAWIA (`boundary-probe.yml -f kanarek=uzbrojony`). Zegar wykrywa zaniedbanie, kanarek — rozjazd.

schema_version: 1

access_levels:
  - name: corp_network
    title: "Corporate network"
    # Zakresy podmień na własne. Trzymamy je w repo (a nie w zmiennej CI), bo to informacja jawna
    # i chcemy widzieć w PR, gdy ktoś dokłada nowy zakres — to jest realne poszerzenie granicy.
    #
    # W TEJ ORGANIZACJI POZIOM ZOSTAJE NIEUZBROJONY I TO JEST DECYZJA, NIE ZALEGŁOŚĆ. Lab nie ma sieci
    # korporacyjnej: nie ma zakresu, który dałoby się tu wpisać uczciwie. Adres runnera CI rotuje i jest
    # pulą dostawcy (wpisanie jej autoryzowałoby cudze pipeline'y), adres stanowiska człowieka jest jeden,
    # nierotowalny i osobowy. Zamiast wpisywać wartość „na teraz", poziom mówi wprost, że nie wpuszcza
    # nikogo, a mechanizm access levelu jest mierzony osobno — kanarkiem (DEC-19).
    armed: false
    unarmed_reason: "lab nie ma sieci korporacyjnej — zakresy sa placeholderami RFC 5737 i nie wpuszczaja nikogo"
    ip_subnetworks:
      - "203.0.113.0/24" # TEST-NET-3 (RFC 5737) — placeholder, podmień
      - "198.51.100.0/24" # TEST-NET-2 (RFC 5737) — placeholder, podmień

  # --- device-trust: WYMAGA PŁATNEJ LICENCJI, dlatego domyślnie WYŁĄCZONE -------------------------
  # Silniejsze niż IP (laptop w kawiarni na VPN nadal spełnia corp_network), więc to jest docelowy warunek
  # dostępu człowieka do konsoli — ale organizacja bez licencji BeyondCorp Enterprise dostanie przy apply
  # `Error 400: Org owning policy must have license` (zmierzone, Issue #1904). Poziom, który się nie tworzy,
  # wywraca też wszystko, co go referuje (`corp_network_and_device`), więc oba są odkomentowywane RAZEM,
  # dopiero po potwierdzeniu licencji.
  #
  # - name: corp_managed_device
  #   title: "Corporate managed device"
  #   device_policy:
  #     require_screen_lock: true
  #     require_corp_owned: true
  #     allowed_encryption_statuses:
  #       - ENCRYPTED

  - name: break_glass
    title: "Break-glass (incident only)"
    # UWAGA — DWIE RÓŻNE PROCEDURY NOSZĄ TU JEDNĄ NAZWĘ, i to jest jedyna rzecz, którą trzeba o tym
    # poziomie wiedzieć przed jego uzbrojeniem (DEC-29, #1943 — procedura PRZEĆWICZONA na żywej granicy).
    #
    # `break-glass.yml` — procedura, którą to repozytorium ma — NIE UŻYWA ŻADNEGO ACCESS LEVELU.
    # Wyprowadza członka z konfiguracji EGZEKWOWANEJ i tym przywraca ruch; po democji nie ma reguły,
    # która pytałaby o kontekst, więc nie ma czego spełniać.
    #
    # Poziom niżej należy do procedury INNEJ, której tu nie ma: „granica dalej egzekwuje, ale wpuść
    # bastion". Ta wymaga własnej reguły ingress na członku (profil `corp-user-console-access`), wpisu
    # w `projects.yaml` i własnej sekcji w runbooku — sam poziom nie wpuszcza nikogo, bo nic go nie
    # referuje. Zostawiony bez tego kompletu jest dokładnie tym, przed czym ostrzega pole `armed`:
    # obiektem, który w konsoli wygląda jak gotowa kontrola awaryjna.
    #
    # DECYZJA (#1943): NIE UZBRAJAMY GO „na wszelki wypadek". Albo powstaje ta druga procedura razem
    # z regułą, która poziom referuje — albo poziom znika. Uzbrojony placeholder bez reguły daje
    # najgorszy z możliwych wyników: audyt widzi kontrolę, incydent nie ma z niej pożytku.
    armed: false
    unarmed_reason: "poziom nalezy do procedury 'wpusc bastion przy dzialajacej granicy', ktorej to repo NIE MA; break-glass.yml wyprowadza czlonka z enforced i access levelu nie uzywa (DEC-29, #1943)"
    ip_subnetworks:
      - "192.0.2.10/32" # TEST-NET-1 (RFC 5737) — placeholder, podmień

  # --- kompozycja: poziom zbudowany z innych poziomów ---------------------------------------------
  # DLACZEGO: „korpo-sieć ORAZ zarządzane urządzenie" to najczęstszy realny wymóg dla dostępu człowieka do
  # danych produkcyjnych. Zamiast duplikować warunki w dwóch miejscach, składamy istniejące poziomy.
  # UWAGA na kolejność: poziom wskazywany w `required_access_levels` musi istnieć — renderer sortuje
  # zależności, ale cykl (A wymaga B, B wymaga A) wykryje dopiero API.
  #
  # SPROSTOWANIE (2026-08-12, #1939): do tego dnia stało tu, że kompozycja BEZ własnego warunku jest
  # odrzucana przez API jako `AccessLevel definition has a trivial condition`. NIEPRAWDA. Ten sam poziom
  # wysłany do ACM z pominięciem renderera:
  #     POST …/accessLevels  {"basic":{"conditions":[{"requiredAccessLevels":["…/corp_network"]}]}}
  # POWSTAJE (odczyt z API potwierdza jeden warunek `requiredAccessLevels`). „Trywialny warunek" pochodził
  # od NAS: `terraform/perimeter.tf` renderował blok `conditions` bezwarunkowo, więc dokładał do kompozycji
  # PUSTY warunek. Poprawione tam, więc wariant niżej działa dziś tak, jak wygląda — czeka już tylko na
  # licencję BeyondCorp dla `corp_managed_device`.
  # - name: corp_network_and_device
  #   title: "Corporate network AND managed device"
  #   combining_function: AND
  #   required_access_levels:
  #     - corp_network
  #     - corp_managed_device

  # Przykład kompozycji, który działa BEZ płatnej licencji: „z korpo-sieci ORAZ z regionu, w którym
  # działamy". Słabszy niż wariant z device-trust, ale pokazuje ten sam mechanizm i da się go zastosować
  # od pierwszego dnia. Po włączeniu licencji BeyondCorp podmień drugi składnik na corp_managed_device.
  - name: corp_network_and_region
    title: "Corporate network AND allowed region"
    # `combining_function: AND` znaczy: OBA warunki muszą być spełnione — region PL/DE ORAZ korpo-sieć.
    # Przestawienie tego jednego słowa na `OR` daje „region PL/DE ALBO korpo-sieć", czyli wpuszcza dowolny
    # adres z regionu; API przyjmuje taką zmianę bez ostrzeżenia (ZMIERZONE 2026-08-12, #1939: odpowiedź 200
    # z `combiningFunction: OR`). Dlatego OR wymaga pola `or_reason` — schemat, reguła `vpcsc.onboarding`
    # i `precondition` renderera pilnują tego niezależnie od siebie (DEC-15).
    #
    # ================================================================================================
    # TEN POZIOM STOI W KONFIGURACJI EGZEKWOWANEJ I NIE AUTORYZUJE DZIŚ NIKOGO — ŚWIADOMIE (#2002)
    # ================================================================================================
    # Referuje go jedyna reguła CZŁONKOWSKA w konfiguracji egzekwowanej (`t-alpha`, profil
    # vertex-online-serving). `AND` wymaga OBU warunków, a `corp_network` jest nieuzbrojony — więc
    # nieosiągalność dziedziczy się i ta reguła nie wpuszcza nikogo. Wariant defektu najłatwiejszy do
    # przeoczenia: poziom nie ma ANI JEDNEGO własnego zakresu IP, więc wypada z każdego „przeglądu
    # zakresów", a mimo to jest bezczynny.
    #
    # DLACZEGO NIE NAPRAWIAMY TEGO ZAKRESEM: patrz `corp_network` wyżej — w labie nie ma zakresu, który
    # dałoby się wpisać uczciwie. DLACZEGO NIE ZAMIENIAMY WARUNKU SIECIOWEGO NA TOŻSAMOŚCIOWY: poziom
    # autoryzujący samą tożsamością nie dokłada nic ponad `identities` reguły, a w scenariuszu, dla
    # którego access level w ogóle istnieje (skradzione poświadczenie użyte z cudzej sieci), zdejmuje
    # jedyną obronę. To byłoby OBEJŚCIE kontroli sieciowej, nie jej naprawa.
    #
    # ZOSTAJE WIĘC ZAPIS ŚWIADOMY I WYGASAJĄCY. Reguła jest dziś kontrolą bezczynną — dopuszczalną, bo
    # `t-alpha` to pusty projekt testowy, a wersja bezczynna jest OSTRZEJSZA, nie luźniejsza (odmawia
    # wszystkim). Data wymusza powrót do tematu zamiast zostawienia notatki na zawsze. Że sam MECHANIZM
    # access levelu działa w obie strony, dowodzi kanarek niżej — osobnymi regułami, na żywo (DEC-19).
    armed: false
    unarmed_reason: "dziedziczy nieuzbrojony corp_network; regula t-alpha jest swiadomie bezczynna, mechanizm mierzy kanarek"
    unarmed_accepted_until: "2026-11-12"
    combining_function: AND
    regions:
      - PL
      - DE
    required_access_levels:
      - corp_network

  # --- tożsamości: konkretne grupy zamiast „ktokolwiek z właściwej sieci" -------------------------
  # Access level z `members` zawęża warunek do wskazanych tożsamości. Bez tego poziom mówi tylko „z tej
  # sieci", więc każdy, kto jest w VPN, spełnia go — także konto, które nie powinno dotykać tych danych.

  # =================================================================================================
  # KANAREK ACCESS LEVELU — para poziomów, którą MIERZY SIĘ ŚCIEŻKĘ POZYTYWNĄ (#2002, DEC-19)
  # =================================================================================================
  # PO CO. Odmowę granicy da się zaobserwować z dowolnego miejsca. Tego, że access level kogoś WPUSZCZA,
  # nie widać nigdzie: audit-log zapisuje NARUSZENIA, nie wpuszczenia, a `describe` pokazuje treść,
  # którą sami wysłaliśmy. Do tej pory nikt w tej organizacji nie zaobserwował, żeby access level
  # cokolwiek przepuścił — a awaria tej połowy (zakres przestał pasować) nie wpuszcza obcych, tylko
  # ODCINA WŁASNYCH, i to dopiero w dniu promocji.
  #
  # JAK. Te dwa poziomy różnią się DOKŁADNIE JEDNĄ rzeczą: kontem, które wymieniają. Reguły `canary-*`
  # w policy.yaml różnią się dokładnie jedną rzeczą: który z nich jest ich źródłem. Sonda woła tą samą
  # tożsamością (`sa-vpcsc-plan`, ta sama, którą chodzi `terraform plan`) dwie metody read-only na tym
  # samym projekcie, w tej samej chwili, z tego samego runnera. Jedno wywołanie ma przejść, drugie
  # dostać odmowę VPC-SC. Każda WSPÓLNA przyczyna — brak roli IAM, wyłączone API, zepsuty projekt,
  # nieobecna reguła — daje ten sam wynik po obu stronach i nie potrafi wyprodukować rozjazdu.
  #
  # DLACZEGO `members`, A NIE ZAKRES IP. Bo to jedyny warunek, który runner CI umie spełnić w sposób
  # deklarowalny z góry: jego adres rotuje, a pula dostawcy obejmuje cudze pipeline'y. Kanarek NIE
  # zastępuje warunku sieciowego w regułach dywizji (to byłoby obejście kontroli) — mierzy MECHANIZM
  # na własnych regułach, własną tożsamością platformy i na metodach opisujących konfigurację
  # logowania, nie dane. Pełne uzasadnienie i odrzucone alternatywy: DEC-19.
  - name: ci_probe_match
    title: "Canary: identity the boundary probe actually uses"
    # UZBROJONY. Para kanarków została zmierzona W CZASIE 2026-08-13 (#2043) — ten sam przelot sondy,
    # ta sama tożsamość, ta sama reguła baseline, jedyna różnica w tym polu:
    #   rozbrojony (ipSubnetworks 203.0.113.7/32): `kanarek-poziom-spelniony` ODMOWA VPC-SC
    #   uzbrojony  (members = konto planu):        `kanarek-poziom-spelniony` PRZESZLO
    # Sonda `kanarek-poziom-niespelniony` dała ODMOWĘ w OBU stanach — to ona pilnuje, że reguła istnieje,
    # a niespełniony access level jest jedynym powodem jej odmowy. Bez połowy rozbrojonej „uzbrojony
    # wpuszcza" byłoby obserwacją, nie dowodem. Procedura: docs/8-zmiany-reczne.md §8.3.
    armed: true
    members:
      - "serviceAccount:sa-vpcsc-plan@rwlab-vpcsc-adm-46bc.iam.gserviceaccount.com"

  - name: ci_probe_mismatch
    title: "Canary: a different, existing platform identity the probe never uses"
    armed: true
    # ACM waliduje ISTNIENIE tożsamości (`invalid or non-existent` odrzuca CAŁĄ zmianę), więc to nie może
    # być konto zmyślone. Bierzemy konto apply: poziom jest osiągalny W ZASADZIE (ktoś MOŻE go spełnić),
    # tylko nie przez sondę. To jest różnica między „warunek nie do spełnienia" a „warunek niespełniony
    # przez to wywołanie" — i dzięki niej negatyw mierzy access level, a nie martwy zapis.
    members:
      - "serviceAccount:sa-vpcsc-apply@rwlab-vpcsc-adm-46bc.iam.gserviceaccount.com"

  # =================================================================================================
  # POZIOM POMIAROWY — TYMCZASOWY, USUWANY W TYM SAMYM ZADANIU (#1937)
  # =================================================================================================
  # PO CO. Żeby zmierzyć, czy parametr `caller_identities` profilu REALNIE ZAWĘŻA, potrzebna jest para:
  # tożsamość Z listy ma przejść, tożsamość SPOZA listy ma paść — a różnić je ma WYŁĄCZNIE ta lista.
  # Każdy access level z konfiguracji nie nadaje się do tego z osobnego powodu: `corp_network_and_region`
  # jest nieuzbrojony (nie wpuszcza nikogo, więc obie połowy pary padłyby z tej samej przyczyny),
  # a `ci_probe_match` wymienia konto planu (spełniłaby go żadna z mierzonych tożsamości).
  # Poziom niżej wymienia OBIE mierzone tożsamości oraz człowieka — dzięki temu access level przestaje
  # być zmienną w tym pomiarze i jedyną różnicą między połowami pary zostaje `identities` reguły.
  #
  # DLACZEGO `members`, A NIE ZAKRES IP — ta sama argumentacja co przy kanarku wyżej: adres runnera
  # i adres stanowiska człowieka są jedynymi, jakie lab ma, i żadnego nie da się wpisać uczciwie.
  #
  # TO NIE JEST WZORZEC DO KOPIOWANIA DO DYWIZJI. Poziom autoryzujący samą tożsamością nie dokłada nic
  # ponad `identities` reguły — w regule produkcyjnej byłby obejściem kontroli sieciowej. Tutaj jest
  # przyrządem pomiarowym o żywotności jednego zadania i jego usunięcie jest częścią tego zadania.
  - name: pomiar_pary_1937
    title: "Measurement: both probed identities and the human (temporary, #1937)"
    armed: true
    members:
      - "serviceAccount:sa-vpcsc-caller@rwlab-ai-vertex-46bc.iam.gserviceaccount.com"
      - "serviceAccount:sa-vpcsc-caller-b@rwlab-ai-vertex-46bc.iam.gserviceaccount.com"
      - "user:mail@rafalwalas.com"

  # --- geografia: odrzucenie ruchu z regionów, w których nie działamy ----------------------------
  # Kody ISO 3166-1 alfa-2. To NIE jest zabezpieczenie kryptograficzne (VPN je omija), ale tanio ucina
  # szum z regionów, w których nie mamy ani pracowników, ani infrastruktury.
  - name: eu_only
    title: "Requests from the EU only"
    combining_function: AND
    regions:
      - DE
      - FR
      - NL

  # --- negacja: poziom, który spełnia się, gdy warunek NIE jest prawdziwy ------------------------
  # DLACZEGO ostrożnie: `negate: true` odwraca sens CAŁEGO warunku. Przydaje się do „wszędzie poza tym
  # zakresem", ale bardzo łatwo o pomyłkę — poziom nazwany „block-x" może w praktyce przepuszczać wszystko
  # poza x, co jest zupełnie inną polityką niż „blokuj x".
  # - name: not_from_lab
  #   title: "Anything except the lab range"
  #   negate: true
  #   ip_subnetworks: ["198.51.100.0/24"]

  # --- custom (CEL): gdy warunki `basic` nie wystarczają ------------------------------------------
  # Poziom `custom` używa wyrażenia CEL i WYKLUCZA się z `basic` — jedno albo drugie, nigdy oba w jednym
  # poziomie. Sięgaj po to tylko wtedy, gdy naprawdę nie da się tego wyrazić warunkami basic; wyrażenie CEL
  # jest nieporównywalnie trudniejsze do zaudytowania niż lista podsieci.
  # - name: corp_device_with_os_check
  #   title: "Managed device with a recent OS"
  #   custom_expression: |
  #     device.encryption_status == DeviceEncryptionStatus.ENCRYPTED &&
  #     device.os_type == OsType.DESKTOP_MAC
