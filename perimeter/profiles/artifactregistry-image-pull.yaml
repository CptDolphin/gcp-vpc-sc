# Profil: kod działający POZA perimetrem pobiera obraz z Artifact Registry projektu członka.
#
# DODANY NA POMIAR (#2043) — wraca w kolejnym pull requeście, razem z członkiem, który go wybiera.
# Po co: procedura dodania profilu (docs/8-zmiany-reczne.md §8.2) nie miała ani jednego przelotu na żywej
# granicy. Zdanie „profil, którego nikt nie wybrał, nie renderuje ani jednej reguły — i dopiero pierwszy
# członek dowodzi, że reguła w tym kształcie jest aplikowalna" było wnioskiem z kodu, nie pomiarem.
#
# DLACZEGO AKURAT TEN KSZTAŁT: `artifactregistry` jest w `restricted_services` od dnia zero (Vertex czyta
# stamtąd obrazy treningowe), a żaden profil w katalogu go nie dotyka — więc to jest zarazem najbardziej
# realistyczny brakujący wzorzec, jaki dało się tu wziąć, i najmniejsza możliwa zmiana granicy.
#
# METODY WYPISANE JAWNIE: API publikuje dla tej usługi 44 metody, więc `*` byłoby tu ZAKAZANE
# (`check_supported_services.py` odrzuca `*` dla usługi z opublikowaną listą). Bierzemy trzy odczytowe —
# tyle, ile potrzeba do `docker pull`, i ani jednej piszącej.

schema_version: 1
name: artifactregistry-image-pull
summary: "Callers outside the perimeter pull container images from the member's Artifact Registry."
# `risk: low` — profil BEZ reguły egress. Etykieta jest wejściem bramki i jest sprawdzana wobec kształtu:
# gdyby ten profil miał `to_external_from`, jedyną dopuszczalną wartością byłoby `high`.
risk: low

parameters:
  - name: caller_identities
    description: "Service accounts pulling images (never ANY_*; explicit SAs only)."
  - name: access_levels
    description: "Access levels the caller must satisfy (corporate network / managed device)."

ingress:
  - title: pull-images
    identities_from: caller_identities
    access_levels_from: access_levels
    to: member_project
    operations:
      - service: artifactregistry.googleapis.com
        methods:
          - "ArtifactRegistry.GetRepository"
          - "ArtifactRegistry.ListPackages"
          - "ArtifactRegistry.GetVersion"

egress: []
